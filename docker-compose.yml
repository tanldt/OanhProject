services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cips-sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Cips@12345!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: